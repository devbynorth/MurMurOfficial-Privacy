name: Validate Repository Structure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate privacy policy exists
        run: |
          if [ ! -f privacy.html ]; then
            echo "ERROR: privacy.html is missing"
            exit 1
          fi
          echo "privacy.html found."

      - name: Validate HTML is well-formed
        run: |
          MISSING=0
          for page in $(git ls-files '*.html'); do
            if ! grep -q "<!DOCTYPE html>" "$page"; then
              echo "ERROR: Missing <!DOCTYPE html> declaration in $page"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "DOCTYPE declaration found on every page."

      - name: Validate required metadata
        run: |
          MISSING=0
          for page in $(git ls-files '*.html'); do
            if ! grep -q 'charset="UTF-8"' "$page"; then
              echo "ERROR: Missing charset meta tag in $page"
              MISSING=1
            fi
            if ! grep -q 'name="viewport"' "$page"; then
              echo "ERROR: Missing viewport meta tag in $page"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "Required metadata present on every page."
