name: "Security Monitoring"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 3 * * 0' # Weekly run on Sunday at 3:15 AM UTC

jobs:
  codeql_scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up CodeQL
      uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      with:
        languages: "actions" # This repo only contains privacy.html and workflow YAML; no JS/Python source exists

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      with:
        upload: never # code scanning / GitHub Advanced Security isn't enabled on this private repo, so SARIF upload fails

  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read # gitleaks-action calls pulls/{n}/commits when triggered on a PR

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Scan for Secrets
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
