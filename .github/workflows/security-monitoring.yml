name: "Security Monitoring"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 3 * * 0' # Weekly run on Sunday at 3:15 AM UTC

jobs:
  codeql_scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: "actions" # This repo only contains privacy.html and workflow YAML; no JS/Python source exists

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dependency_scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Audit for Vulnerable Dependencies
      run: |
        if [ -f package.json ]; then
          npm audit || true
        elif [ -f requirements.txt ]; then
          if pip install safety; then
            safety check -r requirements.txt || true
          else
            echo "Failed to install safety; skipping requirements.txt scan"
          fi
        else
          echo "No supported package manager found. Skipping dependency scan."
        fi

  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Scan for Secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
