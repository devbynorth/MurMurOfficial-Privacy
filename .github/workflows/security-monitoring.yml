name: "Security Monitoring"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 3 * * 7' # Weekly run on Sunday at 3:15 AM UTC

jobs:
  codeql_scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: "javascript, python" # Adjust according to your repository's language

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  dependency_scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Audit for Vulnerable Dependencies
      run: |
        if [ -f package.json ]; then
          npm audit || true
        elif [ -f requirements.txt ]; then
          pip install safety && safety check -r requirements.txt || true
        else
          echo "No supported package manager found. Skipping dependency scan."
        fi

  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Scan for Secrets
      run: |
        git-secrets --scan || true
