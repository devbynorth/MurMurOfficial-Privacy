name: Accessibility Check

on:
  push:
    paths:
      - '**/*.html'
  pull_request:
    paths:
      - '**/*.html'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  accessibility:
    name: pa11y Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pa11y
        run: npm install -g pa11y

      - name: Run accessibility audit
        run: pa11y --standard WCAG2AA --config .pa11yrc.json privacy.html
