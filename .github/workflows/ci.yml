name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint "**/*.html"

  content-validate:
    name: Content Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check for placeholder email addresses
        run: |
          if grep -r "example\.com" --include="*.html" .; then
            echo "ERROR: Placeholder email address found. Replace with a real contact address."
            exit 1
          fi
          echo "No placeholder emails found."

      - name: Check required privacy policy sections
        run: |
          MISSING=0
          for section in "Ingen innsamling" "mikrofon" "Ingen datalagring" "sporing" "nettverkstilkobling" "Barns personvern" "rettigheter" "Endringer" "Kontakt"; do
            if ! grep -qi "$section" privacy.html; then
              echo "ERROR: Required section missing: $section"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All required sections present."

      - name: Check privacy policy is not outdated
        run: |
          # Extract the year from "Sist oppdatert: DD. MMM YYYY"
          YEAR=$(grep -oP '(?<=oppdatert: ).*' privacy.html | grep -oP '\d{4}' | tail -1)
          CURRENT_YEAR=$(date +%Y)
          if [ -z "$YEAR" ]; then
            echo "ERROR: Could not find 'Sist oppdatert' date."
            exit 1
          fi
          AGE=$((CURRENT_YEAR - YEAR))
          if [ "$AGE" -gt 2 ]; then
            echo "ERROR: Privacy policy was last updated in $YEAR ($AGE years ago). Please review and update."
            exit 1
          fi
          echo "Privacy policy is current (last updated $YEAR)."
