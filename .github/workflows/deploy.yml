name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint "**/*.html"

      - name: Verify no placeholder content
        run: |
          if grep -r "example\.com" --include="*.html" .; then
            echo "ERROR: Placeholder content found. Deploy blocked."
            exit 1
          fi

  deploy:
    name: Deploy static site
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Deploy to Platform
        run: |
          echo "Static site deploy command goes here (e.g. Netlify, GitHub Pages, Vercel)"
