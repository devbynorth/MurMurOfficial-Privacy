name: "Enhanced Dependency Scanning"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 3 * * 0' # Weekly run on Sunday at 3:15 AM UTC

permissions:
  contents: read

jobs:
  dependency_scan:
    name: Dependency Audit with Visual Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install npm-audit-html
      run: npm install -g npm-audit-html@1.5.0

    - name: Audit Dependencies and Generate Report
      run: |
        if [ -f package.json ]; then
          npm audit --json | npm-audit-html -o audit-report.html
        else
          echo "No supported package manager found. Skipping visual dependency scan."
        fi

    - name: Upload Audit Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: hashFiles('audit-report.html') != ''
      with:
        name: audit-report
        path: ./audit-report.html
